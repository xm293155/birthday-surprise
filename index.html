<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>丁猪生日惊喜 🐽💆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
}

body{
  background:linear-gradient(135deg,#FFE4EC 0%,#FFF5E0 40%,#E8F5E9 100%);
  display:flex;align-items:center;justify-content:center;
  transition:background 1.5s ease;
}

body.dark-mode{
  background:linear-gradient(135deg,#2D1B33 0%,#1A1A2E 40%,#16213E 100%);
}

/* ====== 漂浮装饰 ====== */
.floating-deco{
  position:fixed;pointer-events:none;z-index:0;
  animation:floatUp linear infinite;
  opacity:0.5;
}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(0deg) scale(0.5);opacity:0}
  10%{opacity:0.5}
  90%{opacity:0.5}
  100%{transform:translateY(-10vh) rotate(360deg) scale(1);opacity:0}
}

/* ====== 步骤容器 ====== */
.step{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.8s ease,transform 0.8s ease;
  z-index:10;
}
.step.hidden{
  opacity:0;pointer-events:none;
  transform:scale(0.95);
}

/* ====== 步骤零：趣味问答 ====== */
#step0{
  z-index:5;
}
.quiz-area{
  display:flex;flex-direction:column;
  align-items:center;gap:20px;
}
.quiz-question{
  color:#D4618C;font-size:26px;font-weight:800;
  text-align:center;text-shadow:0 2px 10px rgba(212,97,140,0.25);
  animation:quizQPop 0.6s ease-out both;
}
@keyframes quizQPop{
  0%{opacity:0;transform:scale(0.5)}
  70%{transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}
.quiz-emoji{
  font-size:40px;margin-top:8px;
  animation:quizEmojiWiggle 2s ease-in-out infinite;
}
@keyframes quizEmojiWiggle{
  0%,100%{transform:rotate(-8deg)}
  50%{transform:rotate(8deg)}
}
.quiz-options{
  display:flex;gap:24px;
  margin-top:16px;
}
.quiz-btn{
  border:none;border-radius:18px;
  padding:16px 32px;font-family:inherit;
  font-size:17px;font-weight:700;
  cursor:pointer;color:#fff;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  letter-spacing:1px;
  position:relative;
}
.quiz-btn-a{
  background:linear-gradient(145deg,#a78bfa,#8b5cf6);
  box-shadow:0 4px 16px rgba(139,92,246,0.35);
  transform:scale(1);
}
.quiz-btn-b{
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  box-shadow:0 4px 16px rgba(255,145,164,0.35);
  transform:scale(1);
}
.quiz-btn-a.wrong{
  transform:scale(0.55) !important;
  opacity:0.4;
  pointer-events:none;
}
.quiz-btn-b.grow{
  transform:scale(1.35) !important;
  box-shadow:0 8px 30px rgba(255,145,164,0.5) !important;
}
.quiz-btn-b.correct{
  animation:correctBounce 0.5s ease-out;
}
@keyframes correctBounce{
  0%{transform:scale(1.35)}
  30%{transform:scale(1.15)}
  60%{transform:scale(1.45)}
  100%{transform:scale(1)}
}
.quiz-hint{
  color:#E8527A;font-size:14px;font-weight:600;
  margin-top:12px;min-height:22px;
  opacity:0;transition:opacity 0.3s;
  text-shadow:0 1px 4px rgba(232,82,122,0.2);
}
.quiz-hint.show{opacity:1}

/* ====== 步骤一：小猪按钮 ====== */
#step1 .pig-btn{
  position:relative;
  width:220px;height:220px;
  border-radius:50%;
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  border:none;cursor:pointer;
  box-shadow:0 8px 30px rgba(255,145,164,0.4),0 0 0 6px rgba(255,182,193,0.3);
  transition:transform 0.3s ease,box-shadow 0.3s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:pigBounce 2s ease-in-out infinite;
}
#step1 .pig-btn:hover{
  transform:scale(1.08);
  box-shadow:0 12px 40px rgba(255,145,164,0.6),0 0 0 8px rgba(255,182,193,0.4);
}
#step1 .pig-btn:active{
  transform:scale(0.96);
}
@keyframes pigBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
#step1 .pig-btn:hover{
  animation:none;transform:scale(1.08);
}

.pig-face{font-size:64px;line-height:1;margin-bottom:4px}
.pig-btn-text{
  color:#fff;font-size:14px;font-weight:600;
  text-shadow:0 1px 3px rgba(0,0,0,0.15);
  letter-spacing:1px;
}

.pig-ear{
  position:absolute;top:-12px;width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
}
.pig-ear.left{left:28px;transform:rotate(-20deg)}
.pig-ear.right{right:28px;transform:rotate(20deg)}
.pig-ear::after{
  content:'';position:absolute;top:6px;left:6px;
  width:24px;height:24px;border-radius:50%;
  background:#FFD1DC;
}

.perm-hint{
  color:#C06080;font-size:12px;
  margin-top:16px;opacity:0.7;
  text-align:center;padding:0 40px;
}

/* ====== 步骤二：按摩仪惊喜 ====== */
#step2{
  z-index:15;
}
#step2 .massage-area{
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}

.massage-title{
  color:#D4618C;font-size:22px;font-weight:700;
  text-align:center;line-height:1.8;
  margin-bottom:10px;
  text-shadow:0 2px 8px rgba(212,97,140,0.2);
  padding:0 20px;
  animation:titlePopIn 0.8s ease-out both;
}
@keyframes titlePopIn{
  0%{opacity:0;transform:scale(0.6) translateY(20px)}
  60%{transform:scale(1.05) translateY(-3px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

.massage-subtitle{
  color:#E8527A;font-size:16px;font-weight:600;
  margin-bottom:28px;
  animation:subtitleFade 0.8s ease-out 0.3s both;
  text-shadow:0 1px 4px rgba(232,82,122,0.15);
}
@keyframes subtitleFade{
  0%{opacity:0;transform:translateY(10px)}
  100%{opacity:1;transform:translateY(0)}
}

/* 按摩仪图标区域 */
.massage-icon-wrap{
  position:relative;
  width:200px;height:200px;
  display:flex;align-items:center;justify-content:center;
  animation:iconBounceIn 1s ease-out 0.5s both;
}
@keyframes iconBounceIn{
  0%{opacity:0;transform:scale(0) rotate(-180deg)}
  60%{transform:scale(1.15) rotate(8deg)}
  80%{transform:scale(0.95) rotate(-3deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}

.massage-icon-big{
  font-size:120px;
  filter:drop-shadow(0 8px 20px rgba(212,97,140,0.3));
  animation:massagePulse 2.5s ease-in-out infinite;
}
@keyframes massagePulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

/* 按摩仪光环效果 */
.massage-glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  border:3px solid rgba(255,182,193,0.4);
  animation:glowRing 2s ease-in-out infinite;
}
@keyframes glowRing{
  0%,100%{transform:scale(1);opacity:0.4;border-color:rgba(255,182,193,0.4)}
  50%{transform:scale(1.15);opacity:0.15;border-color:rgba(255,107,157,0.6)}
}

.massage-glow:nth-child(2){
  animation-delay:0.5s;
  width:210px;height:210px;
}

/* 按摩仪描述文字 */
.massage-desc{
  color:#C06080;font-size:14px;
  text-align:center;line-height:1.8;
  max-width:300px;
  margin-top:24px;
  padding:14px 18px;
  background:rgba(255,240,245,0.7);
  border-radius:12px;
  border:1px solid rgba(255,182,193,0.25);
  animation:descSlideUp 0.8s ease-out 0.9s both;
}
@keyframes descSlideUp{
  0%{opacity:0;transform:translateY(15px)}
  100%{opacity:1;transform:translateY(0)}
}

/* 浮动的小装饰（围绕按摩仪） */
.float-item{
  position:absolute;
  font-size:22px;
  opacity:0.6;
  animation:floatAround 3s ease-in-out infinite;
}
@keyframes floatAround{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(5px,-8px) rotate(5deg)}
  50%{transform:translate(-3px,-12px) rotate(-3deg)}
  75%{transform:translate(-8px,-5px) rotate(3deg)}
}
.float-item:nth-child(1){top:-10px;left:10px;animation-delay:0s}
.float-item:nth-child(2){top:20px;right:-15px;animation-delay:0.7s}
.float-item:nth-child(3){bottom:10px;left:-5px;animation-delay:1.4s}
.float-item:nth-child(4){bottom:-5px;right:15px;animation-delay:2.1s}

/* ====== 礼物入口（延迟淡入） ====== */
.gift-area{
  margin-top:35px;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.8s ease,transform 0.8s ease;
}
.gift-area.visible{
  opacity:1;
  transform:translateY(0);
}
.gift-question{
  color:#FFB6C1;font-size:16px;font-weight:600;
  margin-bottom:16px;
  text-shadow:0 1px 6px rgba(255,182,193,0.3);
}
.gift-btn{
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  color:#fff;border:none;
  font-family:inherit;font-size:16px;font-weight:700;
  padding:12px 32px;border-radius:28px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(255,145,164,0.4);
  transition:transform 0.2s ease,box-shadow 0.2s ease;
  letter-spacing:1px;
}
.gift-btn:hover{
  transform:scale(1.06);
  box-shadow:0 6px 24px rgba(255,145,164,0.6);
}
.gift-btn:active{
  transform:scale(0.95);
}

/* ====== 红包弹窗 ====== */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.55);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.show{
  opacity:1;pointer-events:auto;
}

.modal-card{
  width:85%;max-width:340px;
  background:linear-gradient(180deg,#FFF8FA 0%,#FFE4EC 100%);
  border-radius:24px;
  padding:32px 24px 24px;
  text-align:center;
  position:relative;
  box-shadow:0 16px 48px rgba(0,0,0,0.25);
  transform:scale(0.3);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.show .modal-card{
  transform:scale(1);
}

.modal-pig{
  font-size:52px;
  margin-bottom:8px;
  animation:modalPigBounce 1s ease-in-out infinite;
}
@keyframes modalPigBounce{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-6px) rotate(-5deg)}
  75%{transform:translateY(-6px) rotate(5deg)}
}

.modal-title{
  color:#D4618C;font-size:20px;font-weight:700;
  margin-bottom:20px;
  text-shadow:0 1px 4px rgba(212,97,140,0.2);
}

.modal-code-label{
  color:#C06080;font-size:12px;
  margin-bottom:6px;letter-spacing:2px;
}

.modal-code{
  display:inline-block;
  background:linear-gradient(135deg,#FF4757,#FF6B81);
  color:#fff;
  font-size:32px;font-weight:800;
  letter-spacing:6px;
  padding:12px 28px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(255,71,87,0.35);
  user-select:all;
}

.modal-hint{
  color:#D4618C;font-size:13px;
  margin-bottom:24px;line-height:1.6;
  padding:0 10px;
}

.modal-close-btn{
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  color:#fff;border:none;
  font-family:inherit;font-size:15px;font-weight:700;
  padding:12px 36px;border-radius:24px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(255,145,164,0.4);
  transition:transform 0.2s ease,box-shadow 0.2s ease;
  letter-spacing:1px;
}
.modal-close-btn:hover{
  transform:scale(1.05);
  box-shadow:0 6px 20px rgba(255,145,164,0.6);
}
.modal-close-btn:active{
  transform:scale(0.95);
}

/* ====== 彩纸 ====== */
.confetti-piece{
  position:fixed;top:-10px;
  width:8px;height:12px;
  border-radius:2px;
  z-index:100;pointer-events:none;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  80%{opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ====== 照片回忆墙 ====== */
#photo-album{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:300;
  overflow:hidden;
  opacity:0;
  transition:opacity 1.2s ease;
  pointer-events:none;
  display:flex;flex-direction:column;
}
#photo-album.show{
  opacity:1;pointer-events:auto;
}

.album-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,#1A1A2E 0%,#2D1B33 30%,#3B1F4B 60%,#1A1A2E 100%);
  background-size:100% 400%;
  animation:albumBgBreathe 8s ease-in-out infinite;
}
@keyframes albumBgBreathe{
  0%,100%{background-position:0% 0%}
  50%{background-position:0% 100%}
}

.album-star{
  position:absolute;
  width:2px;height:2px;
  background:#fff;border-radius:50%;
  animation:starTwinkle 2s ease-in-out infinite;
}
@keyframes starTwinkle{
  0%,100%{opacity:0.3;transform:scale(1)}
  50%{opacity:1;transform:scale(1.5)}
}

.album-title{
  position:relative;z-index:10;
  text-align:center;
  padding:36px 20px 12px;
  color:#FFD1DC;font-size:17px;font-weight:700;
  text-shadow:0 2px 12px rgba(255,107,157,0.5);
  letter-spacing:1px;line-height:1.6;
  flex-shrink:0;
}

.album-slider{
  position:relative;z-index:5;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  padding:20px 0 20px;
  gap:24px;
}
.album-slider::-webkit-scrollbar{display:none}
.album-slider{-ms-overflow-style:none;scrollbar-width:none}

.polaroid{
  flex-shrink:0;
  width:260px;
  background:#fff;
  border-radius:10px;
  padding:12px 12px 40px;
  box-shadow:0 6px 24px rgba(0,0,0,0.35);
  scroll-snap-align:center;
  transform:rotate(var(--rot,0deg));
  transition:transform 0.3s ease,box-shadow 0.3s ease;
}
.polaroid:nth-child(odd){ --rot:-2deg; }
.polaroid:nth-child(even){ --rot:1.5deg; }
.polaroid:hover{
  transform:rotate(0deg) scale(1.04);
  box-shadow:0 10px 32px rgba(0,0,0,0.45);
}
.polaroid img{
  width:100%;border-radius:4px;
  display:block;aspect-ratio:3/4;
  object-fit:cover;background:#f0e0e8;
}
.polaroid-caption{
  text-align:center;
  color:#C06080;font-size:12px;
  margin-top:10px;letter-spacing:0.5px;
}

.kiss-btn-wrap{
  position:relative;z-index:10;
  text-align:center;
  padding:12px 20px 32px;
  flex-shrink:0;
}
.kiss-btn{
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  color:#fff;border:none;
  font-family:inherit;font-size:16px;font-weight:700;
  padding:14px 36px;border-radius:28px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(255,145,164,0.5);
  letter-spacing:1px;
  animation:kissPulse 2s ease-in-out infinite;
  transition:transform 0.2s ease;
}
.kiss-btn:active{
  transform:scale(0.94);
}
@keyframes kissPulse{
  0%,100%{transform:scale(1);box-shadow:0 4px 20px rgba(255,145,164,0.5)}
  50%{transform:scale(1.06);box-shadow:0 6px 28px rgba(255,145,164,0.7)}
}

.heart-piece{
  position:fixed;top:-30px;
  z-index:400;pointer-events:none;
  animation:heartFall linear forwards;
}
@keyframes heartFall{
  0%{transform:translateY(0) rotate(0deg) scale(0.5);opacity:1}
  80%{opacity:0.9}
  100%{transform:translateY(110vh) rotate(720deg) scale(1.2);opacity:0}
}

.kiss-modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  z-index:500;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s ease;
}
.kiss-modal-overlay.show{
  opacity:1;pointer-events:auto;
}
.kiss-modal-card{
  width:85%;max-width:340px;
  background:linear-gradient(180deg,#FFF8FA 0%,#FFE4EC 100%);
  border-radius:24px;
  padding:36px 24px 28px;
  text-align:center;
  box-shadow:0 16px 48px rgba(0,0,0,0.3);
  transform:scale(0.3);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
.kiss-modal-overlay.show .kiss-modal-card{
  transform:scale(1);
}
.kiss-modal-emoji{
  font-size:56px;margin-bottom:12px;
  animation:kissEmojiBounce 1s ease-in-out infinite;
}
@keyframes kissEmojiBounce{
  0%,100%{transform:scale(1) rotate(0deg)}
  25%{transform:scale(1.15) rotate(-8deg)}
  75%{transform:scale(1.15) rotate(8deg)}
}
.kiss-modal-text{
  color:#D4618C;font-size:18px;font-weight:700;
  line-height:1.8;
  text-shadow:0 1px 4px rgba(212,97,140,0.2);
}
.kiss-modal-close{
  margin-top:24px;
  background:linear-gradient(145deg,#FFB6C1,#FF91A4);
  color:#fff;border:none;
  font-family:inherit;font-size:15px;font-weight:700;
  padding:12px 32px;border-radius:24px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(255,145,164,0.4);
  transition:transform 0.2s ease;
  letter-spacing:1px;
}
.kiss-modal-close:active{transform:scale(0.94)}
</style>
</head>
<body>

<!-- 步骤零：趣味问答 -->
<div id="step0" class="step">
  <div class="quiz-area">
    <div class="quiz-question">谁是小臭猪？🐽</div>
    <div class="quiz-emoji">🤔</div>
    <div class="quiz-options">
      <button class="quiz-btn quiz-btn-a" id="quizBtnA">A. 小小明</button>
      <button class="quiz-btn quiz-btn-b" id="quizBtnB">B. 丁丁猪</button>
    </div>
    <div class="quiz-hint" id="quizHint"></div>
  </div>
</div>

<!-- 步骤一：小猪按钮 -->
<div id="step1" class="step hidden">
  <button class="pig-btn" id="startBtn">
    <div class="pig-ear left"></div>
    <div class="pig-ear right"></div>
    <div class="pig-face">🐷</div>
    <div class="pig-btn-text">丁猪专属惊喜<br>点击开启 🐽</div>
  </button>
  <div class="perm-hint">点击开启你的生日惊喜吧～</div>
</div>

<!-- 步骤二：按摩仪惊喜 -->
<div id="step2" class="step hidden">
  <div class="massage-area">

    <div class="massage-title">
      祝我的丁猪 <span style="font-size:28px;color:#E8527A;">25岁</span> 生日快乐！🎂
    </div>

    <div class="massage-subtitle">
      叮！你的专属服务已到账 💆✨
    </div>

    <!-- 按摩仪图标区 -->
    <div class="massage-icon-wrap">
      <div class="massage-glow"></div>
      <div class="massage-glow"></div>
      <span class="float-item">✨</span>
      <span class="float-item">💫</span>
      <span class="float-item">⭐</span>
      <span class="float-item">💖</span>
      <div class="massage-icon-big">💆‍♂️</div>
    </div>

    <div class="massage-desc">
      本店今日特供：<strong>猪猪按摩（以后不准缩脖子啦）</strong><br>
      有效期：永久 | 使用次数：无限次<br>
      适用部位：肩颈 / 腰背 / 腿部 / 全身<br>
      <em>请准备好躺好，技师马上就位～</em> 😘
    </div>

    <!-- 延迟出现的礼物入口 -->
    <div class="gift-area" id="giftArea">
      <div class="gift-question">还有个东西要给你～🎁</div>
      <button class="gift-btn" id="giftBtn">点我看看！🙋‍♂️</button>
    </div>

  </div>
</div>

<!-- 红包弹窗 -->
<div class="modal-overlay" id="redPacketModal">
  <div class="modal-card">
    <div class="modal-pig">🐽</div>
    <div class="modal-title">叮！专属暴富金已到账💰</div>
    <div class="modal-code-label">— 支付宝口令红包 —</div>
    <div class="modal-code">丁丁猪and小小明</div>
    <div class="modal-hint">拿去花！去广州给自己买点好吃的～</div>
    <button class="modal-close-btn" id="modalCloseBtn">乖乖收下啦！</button>
  </div>
</div>

<!-- 照片回忆墙 -->
<div id="photo-album">
  <div class="album-bg" id="albumBg"></div>
  <div class="album-title">这半年，和丁猪一起收集的 30 个快乐碎片 ✨</div>
  <div class="album-slider" id="albumSlider"></div>
  <div class="kiss-btn-wrap">
    <button class="kiss-btn" id="kissBtn">立刻兑换现实版亲亲 💋</button>
  </div>
</div>

<!-- 亲亲弹窗 -->
<div class="kiss-modal-overlay" id="kissModal">
  <div class="kiss-modal-card">
    <div class="kiss-modal-emoji">👩‍❤️‍👨</div>
    <div class="kiss-modal-text">
      兑换成功！<br>
      请立刻放下手机，<br>
      拥抱并亲吻你面前的超级好宝贝！🐽
    </div>
    <button class="kiss-modal-close" id="kissModalClose">好哒！😘</button>
  </div>
</div>

<script>
(function(){

  /* ====== 漂浮装饰生成 ====== */
  var decoSymbols = ['♥','♡','✦','★','✧','♡','♥','✿'];
  var decoColors = ['#FFB6C1','#FF91A4','#FFD1DC','#FFE4EC','#FFD700','#FFA07A'];
  function createFloatingDeco(){
    var el = document.createElement('div');
    el.className = 'floating-deco';
    el.textContent = decoSymbols[Math.floor(Math.random()*decoSymbols.length)];
    el.style.left = Math.random()*100 + '%';
    el.style.fontSize = (12 + Math.random()*16) + 'px';
    el.style.color = decoColors[Math.floor(Math.random()*decoColors.length)];
    el.style.animationDuration = (6 + Math.random()*8) + 's';
    el.style.animationDelay = Math.random()*5 + 's';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 14000);
  }
  for(var i=0;i<15;i++){ setTimeout(createFloatingDeco, i*400); }
  setInterval(createFloatingDeco, 1200);

  /* ====== 彩纸生成 ====== */
  var confettiColors = ['#FF6B9D','#FFD700','#87CEEB','#98FB98','#DDA0DD','#FFA07A','#FF69B4','#FFB6C1'];
  function launchConfetti(){
    for(var i=0;i<60;i++){
      (function(idx){
        setTimeout(function(){
          var piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random()*100 + '%';
          piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
          piece.style.width = (6 + Math.random()*6) + 'px';
          piece.style.height = (8 + Math.random()*8) + 'px';
          piece.style.animationDuration = (2 + Math.random()*2) + 's';
          piece.style.animationDelay = '0s';
          document.body.appendChild(piece);
          setTimeout(function(){ piece.remove(); }, 4500);
        }, idx*50);
      })(i);
    }
  }

  /* ====== 步骤控制 ====== */
  var step0 = document.getElementById('step0');
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var startBtn = document.getElementById('startBtn');

  /* ====== 步骤零：趣味问答 ====== */
  var quizBtnA = document.getElementById('quizBtnA');
  var quizBtnB = document.getElementById('quizBtnB');
  var quizHint = document.getElementById('quizHint');
  var wrongCount = 0;

  quizBtnA.addEventListener('click', function(){
    /* 选错：A越来越小，B越来越大 */
    wrongCount++;
    var shrink = Math.max(0.3, 1 - wrongCount * 0.2);
    var grow = 1 + wrongCount * 0.15;
    quizBtnA.style.transform = 'scale(' + shrink + ')';
    quizBtnA.style.opacity = String(Math.max(0.25, 1 - wrongCount * 0.18));
    quizBtnB.style.transform = 'scale(' + grow + ')';
    quizHint.textContent = '不对哦～再想想！🤔';
    quizHint.classList.add('show');
  });

  quizBtnB.addEventListener('click', function(){
    /* 选对了！直接跳转到步骤一 */
    quizBtnB.classList.add('correct');
    setTimeout(function(){
      step0.classList.add('hidden');
      setTimeout(function(){
        step1.classList.remove('hidden');
      }, 400);
    }, 500);
  });

  /* ====== 步骤一：点击直接进入按摩仪惊喜（无需麦克风） ====== */
  startBtn.addEventListener('click', function(){
    step1.classList.add('hidden');
    setTimeout(function(){
      step2.classList.remove('hidden');
      /* 5秒后淡入礼物入口 */
      setTimeout(function(){
        document.getElementById('giftArea').classList.add('visible');
      }, 5000);
    }, 400);
  });

  /* ====== 红包弹窗交互 ====== */
  var modal = document.getElementById('redPacketModal');
  var giftBtn = document.getElementById('giftBtn');
  var modalCloseBtn = document.getElementById('modalCloseBtn');
  var photoAlbum = document.getElementById('photo-album');

  giftBtn.addEventListener('click', function(){
    modal.classList.add('show');
  });

  modalCloseBtn.addEventListener('click', function(){
    modal.classList.remove('show');
    step2.classList.add('hidden');
    setTimeout(function(){
      photoAlbum.classList.add('show');
    }, 600);
  });

  modal.addEventListener('click', function(e){
    if(e.target === modal){
      modal.classList.remove('show');
    }
  });

  /* ====== 生成星空背景 ====== */
  (function(){
    var bg = document.getElementById('albumBg');
    for(var i=0;i<80;i++){
      var star = document.createElement('div');
      star.className = 'album-star';
      star.style.left = Math.random()*100 + '%';
      star.style.top = Math.random()*100 + '%';
      star.style.width = (1 + Math.random()*2) + 'px';
      star.style.height = star.style.width;
      star.style.animationDelay = (Math.random()*3) + 's';
      star.style.animationDuration = (1.5 + Math.random()*2) + 's';
      bg.appendChild(star);
    }
  })();

  /* ====== 生成30张拍立得照片（横向滑动） ====== */
  (function(){
    var slider = document.getElementById('albumSlider');
    var captions = [
      '第一次视频 🍜','酒吧那晚 🌅','第一张合照 😴','偷偷保存你的照片 🎬',
      '你带我吃好吃的 👨‍🍳','陪你复习六级 ☔','丑丑照那天 🎡','视频回小破屋 😊',
      '千里迢迢抱蛋白粉 🍢','第一张牵手照 🛒','带猪猪逛街 📸','偷拍你睡觉 🤝',
      '圣诞合照 🫂','你给我拍照 👜','一起跨年 🧋','一起去唱k ☀️',
      '你笑起来真好看 🎹','一起打游戏 🎮','一起办公室打发时间 🏠','偷偷拍你 😘',
      ,'第一张澡堂照','猪猪吹头 🧤','最可爱小猪照 🍲','一起旅游 🤣',
      '比心大挑战 🚇','床照哈哈哈 💇‍♀️','一起看电影 🛋️','又是泡澡堂 🐷',
      '给猪猪捏脖 🍦',
    ];

    /* 实际存在的文件扩展名映射 */
    var extMap = {1:'png',2:'png',8:'png',26:'png'};

    for(var i=1;i<=30;i++){
      if(i===21) continue; /* 跳过缺失的21号 */
      var ext = extMap[i] || 'jpg';
      var card = document.createElement('div');
      card.className = 'polaroid';

      var img = document.createElement('img');
      img.src = 'photos/' + i + '.' + ext;
      img.alt = '照片' + i;
      img.loading = 'lazy';

      var caption = document.createElement('div');
      caption.className = 'polaroid-caption';
      caption.textContent = captions[i-1] || ('第' + i + '个瞬间');

      card.appendChild(img);
      card.appendChild(caption);
      slider.appendChild(card);
    }
  })();

  /* ====== 亲亲按钮交互 ====== */
  (function(){
    var kissBtn = document.getElementById('kissBtn');
    var kissModal = document.getElementById('kissModal');
    var kissModalClose = document.getElementById('kissModalClose');
    var heartSymbols = ['💕','💗','🐽','💖','💋','💘','🐷','❤️'];

    function launchHearts(){
      for(var i=0;i<50;i++){
        (function(idx){
          setTimeout(function(){
            var heart = document.createElement('div');
            heart.className = 'heart-piece';
            heart.textContent = heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
            heart.style.left = Math.random()*100 + '%';
            heart.style.fontSize = (16 + Math.random()*20) + 'px';
            heart.style.animationDuration = (2.5 + Math.random()*2) + 's';
            document.body.appendChild(heart);
            setTimeout(function(){ heart.remove(); }, 5000);
          }, idx*60);
        })(i);
      }
    }

    kissBtn.addEventListener('click', function(){
      launchHearts();
      setTimeout(function(){
        kissModal.classList.add('show');
      }, 400);
    });

    kissModalClose.addEventListener('click', function(){
      kissModal.classList.remove('show');
    });

    kissModal.addEventListener('click', function(e){
      if(e.target === kissModal){
        kissModal.classList.remove('show');
      }
    });
  })();

})();
</script>
</body>
</html>
